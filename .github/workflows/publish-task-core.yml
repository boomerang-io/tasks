name: Publish task-core

on:
  workflow_dispatch:
  push:
    tags:
      - 'task-core@**'

jobs:
  publish:
    name: Publish @boomerang-io/task-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag version matches package.json
        # A semver only exists on tag pushes (task-core@1.1.0); workflow_dispatch
        # runs have no tag to check against, so this guard is skipped for those.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="$(echo "${GITHUB_REF}" | sed -E 's/.*@([^@]+)$/\1/')"
          PKG_VERSION="$(node -p "require('./packages/core/package.json').version")"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match packages/core/package.json version (${PKG_VERSION})"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish
        run: pnpm publish --filter @boomerang-io/task-core --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
